tooltip: "Read only. Exports to CSV (Excel, ';') the boundary walls of the stair (VS) and smoke filter (FF) rooms, found by the function code of the room number or by the room name: wall type, Type Mark, type Description, thickness, layers with materials, PIR fire parameters (PRE_TE / VVF_TE Resistenza al fuoco, VVF_SN_Compartimento), Revit Fire Rating, base and top constraints, phases, hosted doors, length on the boundary. Linked-model walls are read from the link. For each wall it finds the parallel structural wall behind it in the loaded links (against it or with a cavity up to 500 mm): type, thickness, structural material, cavity, coverage; lists the stretches without structure behind. Reports non-wall boundaries and rooms whose name and code disagree."
