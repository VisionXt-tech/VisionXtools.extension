tooltip: "On the boundary walls of the stair (VS) and smoke filter (FF) rooms with a verified EI 60 typology (PV2.03E, PV2.01B, PV2.01C, PV2.04D) sets VVF_SN_Compartimento = Yes and VVF_TE_Resistenza al fuoco = EI 60; creates or updates the view filter 'VVF_Muri di compartimentazione' (walls with VVF_SN_Compartimento = Yes, red solid cut fill) and applies it to the plans whose name contains LR_VVF, or to their view template when it controls the filters. Preview first, then apply in one transaction; JSON log."
