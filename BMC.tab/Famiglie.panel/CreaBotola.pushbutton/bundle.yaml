tooltip: "Run it in the Family Editor on a freshly opened Metric Generic Model face based.rft. PGI R06 3.11.5-3.11.6: sets the category Specialty Equipment and builds the parametric roof access hatch AR_ATS_BT1.00A (Gorter RHT type): sub-frame through the host, curb, flashing with upstand, gasket, overhanging lid, closed scissor-stair casing (Gorter Small+/Large/XL), dashed manoeuvre area in plan (Yes/No), material parameters, void through the host; 4 clear-opening types compliant with Decreto Regione Lombardia 119/2009. Flex-tests every part on every type, saves with the PGI name and starts Cut Geometry (host, then void)."
