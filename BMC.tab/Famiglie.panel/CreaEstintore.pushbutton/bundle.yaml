tooltip: "Run it in the Family Editor on a freshly opened Metric Specialty Equipment.rft. PGI R06 3.11.5-3.11.6: builds the wall-mounted portable fire extinguisher AR_ATS_ES1.00A (tank, valve head, wall bracket, UNI EN ISO 7010 F001 sign with a Yes/No) with 2 types, powder 6 kg 34A 233B C and CO2 5 kg 113B (Emme Italia datasheets). In plan the 3D geometry is hidden and the red DM 30/11/1983 symbol (square with E, no text) shows at paper size as a nested generic annotation; the instance Yes/No 'Simbolo ruotato 180' keeps it readable. Handle height as an instance parameter, fills the type information, checks every type and saves with the PGI name."
