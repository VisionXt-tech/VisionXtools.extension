tooltip: "Run it in the Family Editor on a freshly opened Metric Specialty Equipment.rft. PGI R06 3.11.5-3.11.6: checks the family category, then builds the parametric Pircher V.A. 30 precast tank: reference planes driven by labelled dimensions (length, width, wall thickness, manhole distance, EQ), walls, bottom and cover slab locked to them, two nested manholes (collar, lid, void cutting the slab), height parameters, type AR_ATS_VA1.01A with Type Mark, Keynote and Description. A flex test reports whether the geometry follows. Proposes saving as AR_ATS_VA1.00A_Vasca monolitica interrata.rfa; loading into the project is manual."
